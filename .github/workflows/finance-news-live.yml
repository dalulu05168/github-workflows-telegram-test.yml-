name: Telegram finance news (scheduled delivery)
on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finance-news-live-ledger
  cancel-in-progress: false
jobs:
  deliver:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRANSLATION_CACHE_DIR: .translation-cache
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .translation-cache
          key: free-translation-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: free-translation-v1-${{ runner.os }}-
      - name: Validate preview configuration and run regression tests
        run: |
          python preflight.py
          python -m unittest discover -s tests -v
      - name: Deliver eligible Chinese-translated news with persistent ledger
        env:
          DRY_RUN: 'false'
          LIVE_APPROVED: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DELIVERY_GITHUB_TOKEN: ${{ github.token }}
        run: python live_runner.py
