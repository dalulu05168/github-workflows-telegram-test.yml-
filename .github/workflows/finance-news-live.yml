name: Telegram finance news (scheduled delivery)
run-name: Finance news | ${{ github.event.inputs.trigger_origin || github.event_name }}
on:
  schedule:
    - cron: '8,18,28,38,48,58 * * * *'
  workflow_dispatch:
    inputs:
      trigger_origin:
        description: 'Wakeup origin; does not change publishing windows or news rules'
        required: false
        default: manual
        type: choice
        options:
          - manual
          - windows
          - cloudflare
permissions:
  contents: read
concurrency:
  group: finance-news-live-ledger
  cancel-in-progress: false
jobs:
  deliver:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRANSLATION_CACHE_DIR: .translation-cache
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .translation-cache
          key: free-translation-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: free-translation-v1-${{ runner.os }}-
      - name: Validate preview configuration and run regression tests
        run: |
          python preflight.py
          python -m unittest discover -s tests -v
      - name: Deliver eligible Chinese-translated news with persistent ledger
        env:
          ENABLE_MARKET_SNAPSHOTS: 'true'
          NEWS_CONTENT_STANDARD: ELLERY_WESTCOTT_NEWS_V1
          WAKEUP_ORIGIN: ${{ github.event.inputs.trigger_origin || github.event_name }}
          DRY_RUN: 'false'
          LIVE_APPROVED: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DELIVERY_GITHUB_TOKEN: ${{ github.token }}
        run: python live_runner.py
      - name: Publish delivery status even when sending fails
        if: always()
        run: |
          python - <<'PY_STATUS'
          import json, os
          from pathlib import Path
          p = Path("reports/delivery-status.json")
          if p.exists():
              report = json.loads(p.read_text())
              summary = "## News delivery status\n\n" + "```json\n" + json.dumps(report, ensure_ascii=False, indent=2) + "\n```\n"
          else:
              summary = "## News delivery did not start\nDependency installation, configuration preflight or tests failed before the sender ran. No delivery is claimed.\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          PY_STATUS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-delivery-status-${{ github.run_id }}
          path: reports/delivery-status.json
          if-no-files-found: warn
          retention-days: 7
