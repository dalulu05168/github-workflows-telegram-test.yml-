name: Telegram finance news (safe prototype)
on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finance-news
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check RSS source health
        run: python check_sources.py
      - name: Report country news coverage
        run: python news_coverage.py
      - name: Preview headlines
        env:
          DRY_RUN: 'true'
          PREVIEW_ALL: 'true'
        run: python news_bot.py
      - name: Preview indicative market sessions (no delivery)
        run: python preview_market_notices.py
      - name: Persist delivered article IDs (live mode only)
        if: ${{ false }} # Requires explicit approval and end-to-end delivery validation
        run: |
          if git diff --quiet -- state/sent.json; then
            echo "No delivered IDs to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/sent.json
          git commit -m "Persist delivered finance news IDs [skip ci]"
          git push origin HEAD:main
