name: Deploy Cloudflare news wakeup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-finance-wakeup-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_DISPATCH_TOKEN: ${{ secrets.CLOUDFLARE_GITHUB_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: scheduler/cloudflare
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check required deployment configuration without printing values
        run: |
          node --input-type=module - <<'JS'
          const missing=['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','GITHUB_DISPATCH_TOKEN'].filter(key=>!process.env[key]?.trim());
          if(missing.length){console.error('NOT DEPLOYED. Configure repository Secrets: '+missing.map(x=>x==='GITHUB_DISPATCH_TOKEN'?'CLOUDFLARE_GITHUB_TOKEN':x).join(', '));process.exit(1);}
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scheduler/cloudflare/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Verify project ownership and configure persistent heartbeat storage
        run: node scripts/prepare-deployment.mjs
      - name: Deploy worker and cron
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.deploy.toml 2>&1 | tee "$RUNNER_TEMP/cloudflare-news-deploy.log"
      - name: Store repository-limited GitHub dispatch credential in Cloudflare
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_DISPATCH_TOKEN" | npx wrangler secret put GITHUB_DISPATCH_TOKEN --config wrangler.deploy.toml
      - name: Verify deployed configuration and expose read-only health URL
        env:
          DEPLOY_LOG: ${{ runner.temp }}/cloudflare-news-deploy.log
        run: node scripts/verify-health.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-deployment-status
          path: reports/cloudflare-deployment-status.json
          if-no-files-found: ignore
          retention-days: 7
