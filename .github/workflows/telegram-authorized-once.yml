name: Authorized single Telegram delivery test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-authorized-once.yml'
permissions:
  contents: read
concurrency:
  group: telegram-one-time-connectivity-test
  cancel-in-progress: false
jobs:
  send:
    if: >-
      github.event.head_commit.message == 'Authorized single Telegram test 20261018T0417Z' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.32.3
      - name: Send exactly one user-authorized test and log receipt
        env:
          TEST_SEND_CONFIRM: SEND_ONE_TEST
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_test_message.py
