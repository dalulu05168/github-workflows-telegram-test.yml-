name: News delivery regression checks
on:
  pull_request:
  push:
    branches: [main, fix/scheduled-delivery-observability-20261018]
    paths: ['**.py', '.github/workflows/**', 'scheduler/cloudflare/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python preflight.py
      - run: python -m unittest discover -s tests -v
      - name: Read-only live market data availability probe (no Telegram send)
        run: python probe_market_snapshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: market-data-availability
          path: reports/market-data-probe.json
          retention-days: 7

  cloud-wakeup:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: scheduler/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scheduler/cloudflare/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
