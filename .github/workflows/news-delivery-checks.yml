name: News delivery regression checks
on:
  pull_request:
  push:
    branches: [main, fix/scheduled-delivery-observability-20261018]
    paths: ['**.py', '.github/workflows/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python preflight.py
      - run: python -m unittest discover -s tests -v
