name: Restore and verify news scheduler (one time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-news-scheduler-once.yml'
permissions:
  contents: read
  actions: write
concurrency:
  group: repair-news-scheduler-once
  cancel-in-progress: false
jobs:
  restore:
    if: >-
      github.event.head_commit.message == 'Restore and verify news scheduler 20261018' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect registration, restore scheduler and dispatch live verification
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time

          route = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/workflows/finance-news-live.yml'
          def api(path, method='GET', fields=()):
              command = ['gh', 'api', path, '--method', method]
              for field in fields:
                  command.extend(['-f', field])
              return subprocess.check_output(command, text=True)

          before = json.loads(api(route))
          print('Workflow registration before repair:', json.dumps(
              {k: before.get(k) for k in ('id', 'name', 'path', 'state')}, ensure_ascii=False), flush=True)
          # Restore only this workflow. Briefly cycling an active registration
          # recovers a stale scheduler without altering the cron or local slots.
          try:
              if before['state'] == 'active':
                  api(route + '/disable', 'PUT')
          finally:
              for attempt in range(3):
                  try:
                      api(route + '/enable', 'PUT')
                      break
                  except subprocess.CalledProcessError:
                      if attempt == 2:
                          raise
                      time.sleep(2)
          after = json.loads(api(route))
          print('Workflow state after repair:', after['state'], flush=True)
          if after['state'] != 'active':
              raise RuntimeError('Workflow was not restored to active')
          api(route + '/dispatches', 'POST', ('ref=main',))
          print('Live verification dispatch accepted; cron and local delivery slots unchanged.', flush=True)
          PY
